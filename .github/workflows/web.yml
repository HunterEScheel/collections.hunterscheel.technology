name: Web

on:
  push:
    branches: ["**"]
    paths-ignore: ["android/**"]
  pull_request:
    paths-ignore: ["android/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
